<!doctype html>
<!--
  Spinnaker API reference, rendered with ReDoc against a static OpenAPI
  spec (swagger.json) in this same directory.

  This page is intentionally just a thin loader: the spec.json is
  refreshed automatically by the Spinnaker release automation
  (.github/actions/spinnaker-release in spinnaker/spinnaker), so this
  file itself should never need to change. Do not replace it with a
  `redoc-cli bundle` output again - that approach embeds the spec into
  the HTML and has no automated way to stay current.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spinnaker API Reference</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <redoc spec-url="swagger.json"></redoc>
    <script>
      // redoc.standalone.js references the Node.js `process` global (via a
      // dependency's process.env check) that doesn't exist in browsers.
      // https://github.com/Redocly/redoc/issues/2323
      window.process = window.process || { env: {} };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/redoc@2/bundles/redoc.standalone.js"></script>
  </body>
</html>
